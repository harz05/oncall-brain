[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncall-brain"
version = "0.1.0"
description = "On-call Brain: incident agents that reason over a FalkorDB knowledge graph and remember what fixed things."
requires-python = ">=3.12"
dependencies = [
  "falkordb>=1.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
embedded = ["falkordblite>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oncall_brain = ["adapters/falkordb/queries/*.cypher", "adapters/falkordb/udf/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running FalkorDB (skipped automatically if none is reachable)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
