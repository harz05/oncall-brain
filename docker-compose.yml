# docker compose up --build              -> UI + API on http://localhost:8000, FalkorDB Browser on http://localhost:3000
# docker compose --profile mcp up --build -> also the MCP server (streamable HTTP) on http://localhost:8001/mcp
x-app-env: &app-env
  FALKORDB_HOST: falkordb
  # Optional real-LLM planner; without a key the deterministic planner runs.
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}

services:
  falkordb:
    image: falkordb/falkordb:v4.22.0  # pinned so procedures and Cypher behaviour match local dev
    ports:
      - "6379:6379"
      - "3000:3000"  # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data  # the image's data dir (/data is a symlink to it)
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment: *app-env
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:  # uvicorn starts only after seeding, so healthy means the default tenant exists
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  mcp:
    build: .
    profiles: ["mcp"]
    # 0.0.0.0, not the 127.0.0.1 default, so the published port reaches it. Endpoint: http://localhost:8001/mcp
    command: python -m oncall_brain.mcp_server --http --host 0.0.0.0 --port 8001
    environment: *app-env
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8001:8001"

volumes:
  falkordb-data:
