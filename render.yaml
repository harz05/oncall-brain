# Render blueprint (https://render.com/docs/blueprint-spec): one Docker web service serving the web UI + HTTP API, the
# MCP server at /mcp and /health. FalkorDB runs on FalkorDB Cloud: the blueprint asks for FALKORDB_URL at creation.
# Render sets RENDER_EXTERNAL_HOSTNAME, which the app accepts as its Host, so ALLOWED_HOSTS stays empty. MCP_TOKEN is
# generated by Render: copy it from the service's Environment tab into ONCALL_BRAIN_TOKEN. See docs/DEPLOY.md.
services:
  - type: web
    name: oncall-brain
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FALKORDB_URL        # rediss://<user>:<password>@<host>:<port> from FalkorDB Cloud
        sync: false
      - key: MCP_TOKEN           # the bearer token /mcp requires (the plugin's ONCALL_BRAIN_TOKEN)
        generateValue: true
      - key: MAX_TENANTS
        value: "10"
      - key: LLM_PROVIDER        # mock = deterministic planner; or anthropic/gemini/openai/groq + LLM_API_KEY
        value: mock
