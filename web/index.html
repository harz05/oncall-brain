<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On-call Brain</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316213a'/%3E%3Ccircle cx='11' cy='11' r='5' fill='%23fb7a3c'/%3E%3Ccircle cx='22' cy='13' r='4.5' fill='%237dd3fc'/%3E%3Ccircle cx='15' cy='23' r='4.5' fill='%23b48cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- Vendored builds (cytoscape 3.30.4, dagre 0.8.5, cytoscape-dagre 2.5.0): no CDN, works offline. Order matters: cytoscape-dagre registers itself on window.cytoscape. -->
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/cytoscape-dagre.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>On-call Brain</h1>
        <p class="tagline">Tells you what broke, why and who to page, with the proof from your service graph.</p>
      </div>
    </div>
    <nav class="views" aria-label="Views">
      <button class="view-tab" data-view="incidents" aria-current="page">Incidents</button>
      <button class="view-tab" data-view="ask">Ask the brain</button>
      <button class="view-tab" data-view="connect">Connect</button>
    </nav>
    <div class="top-actions">
      <div class="menu-wrap">
        <button id="btn-simulate" class="primary-btn" aria-haspopup="menu" aria-expanded="false">Simulate an incident <span class="caret" aria-hidden="true">▾</span></button>
        <div id="simulate-menu" class="menu" role="menu" hidden></div>
      </div>
      <div class="menu-wrap">
        <button id="btn-more" class="icon-btn" aria-label="Status and settings" aria-haspopup="menu" aria-expanded="false">⋯</button>
        <div id="more-menu" class="menu" hidden></div>
      </div>
    </div>
  </header>

  <main>
    <!-- ======================= Incidents ======================= -->
    <section id="view-incidents" class="view incidents">
      <aside class="inbox-panel" id="inbox-panel">
        <div class="panel-head"><h2>Incidents</h2><span id="inbox-counts" class="counts"></span></div>
        <ul id="inbox" class="inbox" aria-label="Incidents"></ul>
        <p id="panel-foot" class="panel-foot"></p>
      </aside>

      <div class="incident-main" id="incident-main">
        <div id="landing" class="landing"></div>

        <article id="incident" class="incident" hidden>
          <div class="incident-head">
            <button id="btn-back" class="back" hidden>← Incidents</button>
            <div class="incident-title">
              <span id="inc-status" class="status-pill"></span>
              <h2 id="inc-title"></h2>
              <span id="inc-sub" class="muted"></span>
            </div>
            <div class="seg" role="tablist" aria-label="Incident view">
              <button id="tab-answer" role="tab" aria-selected="true" aria-controls="answer-view">Answer</button>
              <button id="tab-why" role="tab" aria-selected="false" aria-controls="why-view" tabindex="-1"
                      title="The graph, every agent step and the Cypher behind it">Show me why</button>
            </div>
          </div>

          <div id="answer-view" class="answer-view" role="tabpanel" aria-labelledby="tab-answer" tabindex="0">
            <div id="progress" class="progress"></div>
            <div id="answer" class="answer"></div>
          </div>

          <div id="why-view" class="why-view" role="tabpanel" aria-labelledby="tab-why" tabindex="0" hidden>
            <div class="why-graph" id="why-graph-slot"></div>
            <aside class="why-side" id="why-side"></aside>
          </div>
        </article>
      </div>
    </section>

    <!-- ======================= Ask the brain ======================= -->
    <section id="view-ask" class="view ask-view" hidden>
      <div class="chat">
        <div id="chat-log" class="chat-log"></div>
        <form id="ask-form" class="chat-input">
          <input id="ask-q" type="text" required maxlength="300" autocomplete="off"
                 placeholder="Ask about services, owners, decisions…" aria-label="Ask the company brain">
          <button id="ask-go" class="primary-btn">Ask</button>
        </form>
      </div>
      <div class="ask-graph" id="ask-graph-slot"></div>
    </section>

    <!-- ======================= Connect ======================= -->
    <section id="view-connect" class="view connect-view" hidden>
      <div id="connect" class="connect"></div>
    </section>

    <!-- The one graph canvas; moved between "Show me why" and "Ask the brain". -->
    <div id="graph-wrap" class="graph-wrap">
      <div class="hud" id="hud"></div>
      <div id="graph" role="img" aria-label="Service dependency graph; the agent steps panel lists what is highlighted"></div>
      <div class="graph-foot">
        <ul class="legend" aria-label="Legend">
          <li><i class="lg t1"></i>tier-1 service</li>
          <li><i class="lg alerting"></i>alerting</li>
          <li><i class="lg shared"></i>shared upstream</li>
          <li><i class="lg chg"></i>change</li>
          <li><i class="lg person"></i>person</li>
          <li><i class="lg team"></i>team</li>
          <li><i class="lg inc"></i>past incident</li>
          <li><i class="lg rb"></i>runbook</li>
          <li><i class="ln retired"></i>retired dependency</li>
          <li><i class="ln cause"></i>cause path</li>
          <li><i class="ln memory"></i>memory link</li>
        </ul>
        <div class="graph-tools" id="graph-tools"></div>
      </div>
    </div>
  </main>

  <p id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
